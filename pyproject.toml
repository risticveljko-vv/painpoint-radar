[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "painpoint-radar"
dynamic = ["version"]
description = "Developer pain points from public Reddit archives: collect active threads, cluster the problems, score provider sentiment, rank threads worth joining."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Veljko Ristic" }]
dependencies = []

[project.optional-dependencies]
sentiment = ["vaderSentiment>=3.3"]

[project.scripts]
painpoint-radar = "painpoint_radar.cli:main"

[tool.hatch.version]
path = "src/painpoint_radar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/painpoint_radar"]
