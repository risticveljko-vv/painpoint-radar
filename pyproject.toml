[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "painpoint-radar"
dynamic = ["version"]
description = "Reddit pain points and voice-of-customer research for developer products, from public Reddit archives (no API key): cluster problems, score tool sentiment, rank threads worth joining."
license = "MIT"
keywords = ["reddit", "pain points", "voice of customer", "market research", "sentiment analysis", "arctic shift", "pushshift", "devrel"]
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Veljko Ristic" }]
dependencies = []

[project.optional-dependencies]
sentiment = ["vaderSentiment>=3.3"]

[project.scripts]
painpoint-radar = "painpoint_radar.cli:main"

[tool.hatch.version]
path = "src/painpoint_radar/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/painpoint_radar"]
